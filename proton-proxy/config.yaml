name: "Proton Proxy"
version: "1.0.0"
slug: "proton-proxy"
description: "Proton VPN (WireGuard) as an HTTP proxy for other apps, e.g. HypeBot"
url: "https://github.com/njyjn/ha-addons/tree/main/proton-proxy"
arch:
  - aarch64
  - amd64
startup: system
boot: auto
init: false
# A VPN needs these; there is deliberately no `ports:` mapping, so the proxy
# is only reachable by other apps, not from the home network.
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
options:
  wireguard_private_key: ""
  wireguard_address: ""
  server_countries: "Singapore"
  server_cities: ""
  free_only: false
schema:
  wireguard_private_key: "password"
  wireguard_address: "str?"
  server_countries: "str?"
  server_cities: "str?"
  free_only: "bool?"
