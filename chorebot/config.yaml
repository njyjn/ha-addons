name: "ChoreBot"
version: "0.1.0"
slug: "chorebot"
description: "Household chore tracker with overdue alerts"
startup: services
boot: auto
host_network: true
ingress: false
webui: "http://[HOST]:[PORT:3002]"
homeassistant_api: true
map:
  - type: share
    read_only: false
options:
  database_url: ""
  port: 3002
  helper_name: "Aye Aye"
  alert_time: "20:00"
  notify_service: ""
  notify_target: ""
  slack_webhook_url: ""
  reminders_title: "TAKING CARE OF ZARA - CANNOT FORGET"
  reminders:
    - "MUST ALWAYS WATCH ZARA"
    - "Cut all fruits like grapes, blueberry that can easily choke"
    - "Remove bones of fish separately before mixing with Zara food"
    - "Lock all cabinets"
    - "Put door hook/sponges on ALL doors"
schema:
  database_url: "str?"
  port: "port"
  helper_name: "str?"
  alert_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  notify_service: "str?"
  notify_target: "str?"
  slack_webhook_url: "str?"
  reminders_title: "str?"
  reminders:
    - "str"
arch:
  - aarch64
